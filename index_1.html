<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>윤세미_디자인 포트폴리오 | AR 필터 체험</title><meta name="description" content="카메라 접근 허용 후 이용할 수 있습니다. 사진 불러오기도 지원하며, 이미지는 서버에 전송되지 않습니다."><meta property="og:type" content="website"><meta property="og:url" content="https://semiii16.github.io/snow-filter/"><meta property="og:title" content="윤세미_디자인 포트폴리오 | AR 필터 체험"><meta property="og:description" content="카메라 접근 허용 후 이용할 수 있습니다. 사진 불러오기도 지원하며, 이미지는 서버에 전송되지 않습니다."><meta property="og:image" content="https://semiii16.github.io/snow-filter/assets/final/banner-charm-full.png"><meta property="og:image:width" content="585"><meta property="og:image:height" content="370"><meta property="og:locale" content="ko_KR"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="style.css"></head><body>
<main class="studio"><section class="camera-card" aria-label="카메라 스튜디오"><div class="stage"><video id="video" autoplay playsinline muted hidden></video><canvas id="canvas" width="960" height="1100" aria-label="필터 미리보기"></canvas><div id="welcome" hidden><button id="start" disabled>얼굴 인식 준비 중</button></div><span id="modeBadge" class="mode-badge" hidden></span><span id="count" hidden></span><button id="shutter" aria-label="사진 촬영" title="사진 촬영" disabled></button></div>
<div class="toolbar"><button id="camera" class="hand outlined" disabled>카메라 켜기</button><button id="stop" class="hand" disabled>끄기</button><label class="hand button" for="photo" tabindex="0">사진 불러오기<input id="photo" type="file" accept="image/*" hidden></label></div>
<div class="background-control" hidden><label class="background-label" for="background"><span>겨울 배경</span><span class="switch"><input id="background" type="checkbox" role="switch" checked disabled><span class="switch-track" aria-hidden="true"></span></span></label><span id="backgroundStatus" role="status">배경 준비 중…</span></div><div id="charmChoices" role="group" aria-label="부적 선택"><strong class="charm-title">부적 선택</strong><button data-charm="0" aria-pressed="true">만사형통</button><button data-charm="1" aria-pressed="false">부자</button><button data-charm="2" aria-pressed="false">걱정제로</button></div><div id="hoodChoices" hidden role="group" aria-label="양 탈 선택"><strong class="charm-title">양 탈 선택</strong><button data-hood="1" aria-pressed="true">복실 양</button><button data-hood="2" aria-pressed="false">몽글 양</button></div><div class="save-row"><button id="save" class="hand" disabled>사진 저장</button></div><p id="message" role="status" aria-live="polite">카메라를 켜거나 사진을 불러와 필터를 체험해보세요.</p></section>
<section class="collection"><div class="filters"><button class="filter banner charm-banner selected" aria-pressed="true" data-filter="3" disabled><img class="banner-full" src="assets/final/banner-charm-full.png" alt="행운을 부르는 신년 필수 필터"></button><button class="filter banner hood-banner" aria-pressed="false" data-filter="1" disabled><img class="banner-full" src="assets/final/banner-hood-full.png" alt="메---에 뽀글이 모드"></button></div><details class="editor"><summary>필터 위치 조정</summary><p id="engine" role="status">얼굴 인식 준비 중…</p><div class="segmented"><button data-people="1" aria-pressed="true">혼자 테스트</button><button data-people="2" aria-pressed="false">둘이 테스트</button></div><div id="layerEditor"></div><div hidden><div class="control"><span class="label">기존 테스트 에셋</span><div class="asset-row"><div><strong>A · 리본</strong><span id="assetAName">기본 테스트 소재</span></div><label class="small-button" for="assetA">이미지 교체<input id="assetA" type="file" accept="image/png,image/webp,image/jpeg" hidden></label></div><div class="asset-row"><div><strong>B · 별</strong><span id="assetBName">기본 테스트 소재</span></div><label class="small-button" for="assetB">이미지 교체<input id="assetB" type="file" accept="image/png,image/webp,image/jpeg" hidden></label></div><p class="hint">투명 배경 PNG 권장. 선택한 파일은 업로드되지 않아요.<br>새로고침하면 기본 소재로 돌아와요.</p><button id="swap" class="text-btn">A / B 역할 바꾸기 ⇄</button></div>
<div class="control"><label class="label" for="anchor">03 / 붙일 위치</label><select id="anchor"><option value="forehead">이마 위</option><option value="left">화면 왼쪽 볼</option><option value="right">화면 오른쪽 볼</option><option value="nose">코 중심</option></select><label class="slider-label" for="size">장식 크기 <output id="sizeValue">70%</output></label><input id="size" type="range" min="15" max="140" value="70"><label class="slider-label" for="offset">위아래 위치 <output id="offsetValue">0</output></label><input id="offset" type="range" min="-80" max="80" value="0"></div>
</div><div class="toggles"><label><input id="effect" type="checkbox" checked>장식 보이기</label><label><input id="debug" type="checkbox">추적점 보기</label><label><input id="mirror" type="checkbox" checked>거울 모드</label></div><div class="bottom-actions"><button id="reset">기본값 복원</button><button id="export">설정 저장 ↓</button></div></details></section></main><footer>개인 포트폴리오용 콘셉트 · SNOW 공식 서비스가 아닙니다. <span>사진은 기기 안에서 처리됩니다.</span></footer><script type="module" src="app.js"></script></body></html>
